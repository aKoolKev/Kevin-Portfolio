<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<!-- Particle effect -->

		<script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

		
		<!-- Font awesome cdn -->
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css" integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />

		<!-- Google font: Roboto & Poppins-->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="bg-slate-950 text-white relative">
		<div style="display: contents" class="relative z-[1]">%sveltekit.body%</div>
		<div class="absolute min-h-screen top-0 left-0 w-full z-[-1] opacity-70">
			<div class="absolute inset-0" id="particles-js"></div>
		</div>
		<script>
			particlesJS.load('particles-js', 'assets/particles.json', function(){
				console.log('Callback - particle.js co;nfig loaded');
			});
		</script>
	</body>
</html>
